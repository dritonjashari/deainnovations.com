<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon build of the mark. Self-contained gradients (no shared <defs> to
       reference here) and fewer scattered pixels than the full LogoMark, because
       at 16px the small ones turn to mush. -->
  <defs>
    <linearGradient id="a" x1="0.75" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="b" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff" />
      <rect x="14" y="14" width="8" height="8" rx="1.8" fill="#000" />
      <rect x="12.5" y="33" width="8.5" height="8.5" rx="1.9" fill="#000" />
    </mask>
  </defs>

  <path
    d="M52.06 11.94 A27 27 0 1 0 52.06 52.06 L44.70 43.89 A16 16 0 1 1 44.70 20.11 Z"
    fill="url(#a)"
    mask="url(#m)"
  />

  <g fill="url(#b)">
    <rect x="1.5" y="28.5" width="6.5" height="6.5" rx="1.6" />
    <rect x="4" y="17.5" width="5" height="5" rx="1.3" opacity="0.8" />
    <rect x="5.5" y="41" width="5" height="5" rx="1.3" opacity="0.7" />
  </g>

  <path d="M27 46.5 L36 33 L45.5 46.5 Z" fill="url(#b)" />
  <path d="M38 46.5 L47 31.5 L56 46.5 Z" fill="url(#b)" opacity="0.7" />
  <path
    d="M39.5 18 c1.2 4.9 2.4 6.1 7.3 7.3 -4.9 1.2 -6.1 2.4 -7.3 7.3 -1.2 -4.9 -2.4 -6.1 -7.3 -7.3 4.9 -1.2 6.1 -2.4 7.3 -7.3 Z"
    fill="#22d3ee"
  />
</svg>
